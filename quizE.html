<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCM E - UAE 5 : Les Injections</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family:Arial,sans-serif; background:#f8f9fa; color:#000; padding:20px; }
        .container { max-width:900px; margin:auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
        h1 { color:#C64E4F; text-align:center; margin-bottom:20px; }
        .question { margin:30px 0; font-size:1.25rem; font-weight:bold; }
        .option { margin:12px 0; padding:12px; border:1px solid #ddd; border-radius:8px; cursor:pointer; transition:0.2s; }
        .option:hover { background:#f0f8ff; }
        button { background:#C64E4F; color:white; padding:16px 40px; border:none; border-radius:8px; font-size:1.3rem; cursor:pointer; margin:30px auto; display:block; }
        button:disabled { background:#aaa; cursor:not-allowed; }
        #result { margin-top:40px; font-size:1.6rem; text-align:center; font-weight:bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>QCM E - UAE 5 : Les Injections</h1>
        <div id="quiz"></div>
        <button id="submit">Valider mes réponses</button>
        <div id="result"></div>
    </div>

    <script>
        const supabase = Supabase.createClient('https://sevrfgivcpefyykuffti.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNldnJmZ2l2Y3BlZnl5a3VmZnRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NDI1NTMsImV4cCI6MjA3ODUxODU1M30.YZnkSHsVWKQEhfU7xYfWyTFmtkM28Zuzdu7Y1sjBXQc');

        const user = localStorage.getItem('currentUser');
        if (!user) window.location.href = 'login.html';

        // Vérifie si le QCM D est validé
        (async () => {
            const { data } = await supabase.from('users').select('evaluationD').eq('user', user).single();
            if (data.evaluationD < 12) {
                document.getElementById('result').innerHTML = 'Vous devez valider le QCM D avant de continuer.';
                document.getElementById('submit').disabled = true;
            }
        })();

        // Emplacement pour tes 35 questions différentes. Ajoute-les ici
        const questionsPool = [
            { q: "Exemple de question 1 ?", o: ["Opt1", "Opt2", "Opt3", "Toutes les réponses", "Aucune des réponses"], a: "Opt1" },
            { q: "Exemple de question 2 ?", o: ["OptA", "OptB", "OptC", "Toutes les réponses", "Aucune des réponses"], a: "OptB" },
            // Ajoute tes 33 autres questions ici au même format
        ];

        function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }
        const questions = shuffle([...questionsPool]).slice(0, 20);

        const quizDiv = document.getElementById('quiz');
        questions.forEach((q, i) => {
            const div = document.createElement('div');
            div.className = 'question';
            div.innerHTML = `<p>${i+1}. ${q.q}</p>`;
            shuffle(q.o).forEach(opt => {
                div.innerHTML += `<label class="option"><input type="radio" name="q${i}" value="${opt}"> ${opt}</label><br>`;
            });
            quizDiv.appendChild(div);
        });

        // Déconnexion si on quitte la page
        window.onbeforeunload = () => {
            localStorage.removeItem('currentUser');
            return "Attention : quitter cette page vous déconnectera et vous devrez recommencer l'examen.";
        };

        document.getElementById('submit').onclick = async () => {
            let score = 0;
            questions.forEach((q, i) => {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                if (selected && selected.value === q.a) score++;
            });

            const result = document.getElementById('result');
            result.innerHTML = `Votre score : ${score} / 20<br>`;

            const { data } = await supabase.from('users').select('essaiE').eq('user', user).single();
            let essais = (data?.essaiE || 0) + 1;

            if (score >= 12) {
                result.innerHTML += "<span style='color:green'>Réussi ! Vous avez terminé tous les QCM. Mise à jour de la réussite globale.</span>";
                await supabase.from('users').update({ evaluationE: score, essaiE: essais, reussite: true }).eq('user', user);
                setTimeout(() => window.location.href = 'success.html', 3000);
            } else {
                result.innerHTML += "<span style='color:red'>Échec.</span><br>Essais restants : " + (3 - essais);
                await supabase.from('users').update({ essaiE: essais }).eq('user', user);
                if (essais >= 3) {
                    result.innerHTML += "<br><strong style='color:#900'>3 essais épuisés. Contactez l'administrateur.</strong>";
                    document.getElementById('submit').disabled = true;
                }
            }
        };
    </script>
</body>
</html>
