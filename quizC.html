<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM C - SIAMU Tactique / TCCC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family:'Arial',sans-serif; background:#f8f9fa; padding:20px; }
.container { max-width:960px; margin:auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
h1 { color:#C64E4F; text-align:center; margin-bottom:30px; }
.question { margin:30px 0; font-weight:bold; }
.option { display:block; margin:15px 0; padding:15px; border:1px solid #ccc; border-radius:8px; cursor:pointer; }
button { background:#C64E4F; color:#fff; padding:15px 40px; border:none; border-radius:8px; font-size:1.2rem; cursor:pointer; margin:40px auto; display:block; }
button:disabled { background:#aaa; cursor:not-allowed; }
#result { margin-top:30px; font-size:1.4rem; text-align:center; font-weight:bold; }
</style>
</head>
<body>

<div class="container">
<h1>QCM C - SIAMU Tactique / TCCC</h1>
<div id="quiz"></div>
<button id="submit">Valider mes réponses</button>
<div id="result"></div>
</div>

<script>
/* ===================== SUPABASE ===================== */
const supabaseUrl = 'https://sevrfgivcpefyykuffti.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNldnJmZ2l2Y3BlZnl5a3VmZnRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NDI1NTMsImV4cCI6MjA3ODUxODU1M30.YZnkSHsVWKQEhfU7xYfWyTFmtkM28Zuzdu7Y1sjBXQc';
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

/* ===================== AUTH ===================== */
const currentUser = localStorage.getItem('currentUser');
if(!currentUser) location.href='login.html';

/* ===================== QUESTIONS ===================== */
const questionsPool = [
{ q:"Taux de mortalité des hémorragies en zones de jonction ?", o:["20%","30%","40%","50%"], a:"40%" },
{ q:"Signe clé d’un pneumothorax sous tension ?", o:["Tachycardie","Déviation trachéale","Hypothermie","Bradycardie"], a:"Déviation trachéale" },
{ q:"Valeur critique d’hypoxie (PO2) ?", o:["<80","<70","<60","<50"], a:"<60" },
{ q:"Norme TCCC perfusion ?", o:["HR>100 & BP<100","HR>120 & BP<90","HR>110 & BP<80","HR>90 & BP<100"], a:"HR>120 & BP<90" },
{ q:"Garrot MARCH : délai maximal ?", o:["<1min","<2min","<3min","<5min"], a:"<2min" },
{ q:"Placement garrot ?", o:["1-2cm haut plaie","3-4cm haut plaie","5-7cm haut plaie","10cm haut plaie"], a:"5-7cm haut plaie" },
{ q:"Airway MARCH : NPA si ?", o:["GCS<15","GCS<12","GCS<10","GCS<8"], a:"GCS<8" },
{ q:"Needle decompression : localisation ?", o:["3e espace MCL","2e espace MID","5e espace axillaire","1er espace sternal"], a:"2e espace MID" },
{ q:"TXA : délai maximal d’administration ?", o:["1h","2h","3h","4h"], a:"3h" },
{ q:"Couverture hypothermie MARCH ?", o:["Couverture laine","Couverture mylar","Couverture coton","Aucune"], a:"Couverture mylar" },
{ q:"RCP tactique zone chaude ?", o:["30:2","Ventilation only","Compressions only","Aucune RCP"], a:"Compressions only" },
{ q:"Antiarythmique tactique FV réfractaire ?", o:["Lidocaïne","Amiodarone 150mg","Amiodarone 300mg","Atropine"], a:"Amiodarone 300mg" },
{ q:"Kétamine dose IM ?", o:["10mg","20mg","50mg","100mg"], a:"50mg" },
{ q:"Morphine contre-indication ?", o:["Douleur","Resp <12/min","Hypothermie","Tachycardie"], a:"Resp <12/min" },
{ q:"Fentanyl lozenge dose ?", o:["200mcg","400mcg","600mcg","800mcg"], a:"800mcg" },
{ q:"Celox est :", o:["Un antibiotique","Un hémostatique","Un analgésique","Un vasopresseur"], a:"Un hémostatique" },
{ q:"SAM Splint : temps de moulage ?", o:["5s","10s","20s","30s"], a:"30s" },
{ q:"Plaie pénétrante : geste prioritaire ?", o:["Suture","Packing + seal","Massage","Aspirer"], a:"Packing + seal" },
{ q:"Brûlure tactique : refroidissement ?", o:["Eau abondante","Eau glacée","Sans eau","Gel"], a:"Sans eau" },
{ q:"Phase Under Fire : priorité ?", o:["Airway","Circulation","Garrot","Hypothermie"], a:"Garrot" }
];

/* ===================== GENERATION DU QUIZ ===================== */
const selectedQuestions = questionsPool.sort(()=>Math.random()-0.5).slice(0,20);
const quizDiv = document.getElementById('quiz');
selectedQuestions.forEach((q,i)=>{
    const div = document.createElement('div');
    div.className='question';
    div.innerHTML=`<p>${i+1}. ${q.q}</p>`;
    q.o.sort(()=>Math.random()-0.5).forEach(opt=>{
        const label = document.createElement('label');
        label.className='option';
        label.innerHTML=`<input type="radio" name="q${i}" value="${opt}"> ${opt}`;
        div.appendChild(label);
    });
    quizDiv.appendChild(div);
});

/* ===================== SUBMIT ===================== */
document.getElementById('submit').onclick = async ()=>{
    let score = 0;
    selectedQuestions.forEach((q,i)=>{
        const sel = document.querySelector(`input[name="q${i}"]:checked`);
        if(sel && sel.value === q.a) score++;
    });

    const resultDiv = document.getElementById('result');

    try{
        const { data, error } = await supabaseClient
            .from('users')
            .select('essaic,evaluationc')
            .eq('username', currentUser)
            .single();
        if(error){ console.error(error); resultDiv.innerHTML="Erreur lecture essais"; return; }

        let essais = (data?.essaic || 0) + 1;

        if(score>=12){
            const { error:updateError } = await supabaseClient
                .from('users')
                .update({ evaluationc: score, essaic: essais })
                .eq('username', currentUser);
            if(updateError){ console.error(updateError); resultDiv.innerHTML="Erreur sauvegarde"; return; }

            resultDiv.innerHTML=`✅ Réussi : ${score}/20<br>Retour au dashboard...`;
            setTimeout(()=> location.href='dashboard.html',3000);
        }else{
            const { error:updateError } = await supabaseClient
                .from('users')
                .update({ essaic: essais })
                .eq('username', currentUser);
            if(updateError){ console.error(updateError); resultDiv.innerHTML="Erreur sauvegarde"; return; }

            resultDiv.innerHTML=`❌ Échec : ${score}/20<br>Essais restants : ${3-essais}`;
            if(essais>=3){
                resultDiv.innerHTML+=`<br><strong style="color:#900">3 essais épuisés. Contactez l'administrateur.</strong>`;
                document.getElementById('submit').disabled = true;
            }
        }

    }catch(err){
        console.error(err);
        resultDiv.innerHTML=`<strong style="color:#d00">Erreur : ${err.message}</strong>`;
    }
};
</script>
</body>
</html>
