<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM D - SIAMU OPEX</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family:'Arial',sans-serif; background:#f8f9fa; padding:20px; }
.container { max-width:960px; margin:auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
h1 { color:#C64E4F; text-align:center; margin-bottom:30px; }
.question { margin:30px 0; font-weight:bold; }
.option { display:block; margin:15px 0; padding:15px; border:1px solid #ccc; border-radius:8px; cursor:pointer; }
button { background:#C64E4F; color:#fff; padding:15px 40px; border:none; border-radius:8px; font-size:1.2rem; cursor:pointer; margin:40px auto; display:block; }
button:disabled { background:#aaa; cursor:not-allowed; }
#result { margin-top:30px; font-size:1.4rem; text-align:center; font-weight:bold; }
</style>
</head>
<body>

<div class="container">
<h1>QCM D - SIAMU OPEX</h1>
<div id="quiz"></div>
<button id="submit">Valider mes réponses</button>
<div id="result"></div>
</div>

<script>
/* ===================== SUPABASE ===================== */
const supabaseUrl = 'https://sevrfgivcpefyykuffti.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNldnJmZ2l2Y3BlZnl5a3VmZnRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NDI1NTMsImV4cCI6MjA3ODUxODU1M30.YZnkSHsVWKQEhfU7xYfWyTFmtkM28Zuzdu7Y1sjBXQc';
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

/* ===================== AUTH ===================== */
const currentUser = localStorage.getItem('currentUser');
if(!currentUser) location.href='login.html';

/* ===================== QUESTIONS ===================== */
const questionsPool = [
{ q:"Organe le plus sensible au blast ?", o:["Reins","Foie","Oreilles","Rate"], a:"Oreilles" },
{ q:"Dengue : seuil critique plaquettes ?", o:["<100k","<80k","<60k","<50k"], a:"<50k" },
{ q:"PO2 normal en OPEX (altitude ajustée) ?", o:["80-100","75-95","70-90","60-80"], a:"75-95" },
{ q:"Décontamination CBRN : délai maximal ?", o:["3 min","6 min","9 min","12 min"], a:"9 min" },
{ q:"Triage OPEX recommandé ?", o:["START","SALT","TCCC Alpha","ABCDE"], a:"SALT" },
{ q:"Walking Blood Bank : groupe donneur universel ?", o:["A+","B-","AB+","O-"], a:"O-" },
{ q:"RCP OPEX : fréquence compressions ?", o:["80-100/min","90-110/min","100-120/min","120-140/min"], a:"100-120/min" },
{ q:"RCP OPEX : éviter ventilations si ?", o:["Hypothermie","CBRN","Blast","Trauma crânien"], a:"CBRN" },
{ q:"Hypothermie OPEX : durée RCP possible ?", o:["30 min","1h","2h","3h"], a:"3h" },
{ q:"Atovaquone-Proguanil : indication ?", o:["Douleur","Palu prophylaxie","Hypotension","Convulsions"], a:"Palu prophylaxie" },
{ q:"Ciprofloxacine : risque majeur ?", o:["Photosensibilité","Tendinites","Hypothermie","Bradycardie"], a:"Tendinites" },
{ q:"Lopéramide : contre-indication ?", o:["Fièvre","Sang/dysenterie","Déshydratation","Douleur"], a:"Sang/dysenterie" },
{ q:"Doxycycline : effet secondaire ?", o:["Hypothermie","Photosensibilité","Bradycardie","Tachycardie"], a:"Photosensibilité" },
{ q:"Ertapénem : voie recommandée ?", o:["IV","IM","SC","PO"], a:"IM" },
{ q:"Atropine OPEX : indication ?", o:["Hypotension","CBRN (gaz)","Douleur","Hypoxie"], a:"CBRN (gaz)" },
{ q:"Pralidoxime : indication ?", o:["Hypothermie","Nerve agents","Hypoxie","Blast"], a:"Nerve agents" },
{ q:"Diazepam IM : indication OPEX ?", o:["Douleur","Convulsions CBRN","Hypotension","Hypoxie"], a:"Convulsions CBRN" },
{ q:"Brûlure OPEX : premier geste ?", o:["Eau glacée","Ringer OPEX","Gel","Couverture"], a:"Ringer OPEX" },
{ q:"Plaie pénétrante OPEX : priorité ?", o:["Suture","Décontamination CBRN","Massage","Aspirer"], a:"Décontamination CBRN" },
{ q:"Role 1 Kit : élément indispensable ?", o:["Ventoline","Transfusions O-","ECG 12 dérivations","Scanner portable"], a:"Transfusions O-" }
];

/* ===================== GENERATION DU QUIZ ===================== */
const selectedQuestions = questionsPool.sort(()=>Math.random()-0.5).slice(0,20);
const quizDiv = document.getElementById('quiz');
selectedQuestions.forEach((q,i)=>{
    const div = document.createElement('div');
    div.className='question';
    div.innerHTML=`<p>${i+1}. ${q.q}</p>`;
    q.o.sort(()=>Math.random()-0.5).forEach(opt=>{
        const label = document.createElement('label');
        label.className='option';
        label.innerHTML=`<input type="radio" name="q${i}" value="${opt}"> ${opt}`;
        div.appendChild(label);
    });
    quizDiv.appendChild(div);
});

/* ===================== SUBMIT ===================== */
document.getElementById('submit').onclick = async ()=>{
    let score = 0;
    selectedQuestions.forEach((q,i)=>{
        const sel = document.querySelector(`input[name="q${i}"]:checked`);
        if(sel && sel.value === q.a) score++;
    });

    const resultDiv = document.getElementById('result');

    try{
        const { data, error } = await supabaseClient
            .from('users')
            .select('essaid,evaluationd')
            .eq('username', currentUser)
            .single();
        if(error){ console.error(error); resultDiv.innerHTML="Erreur lecture essais"; return; }

        let essais = (data?.essaid || 0) + 1;

        if(score>=12){
            const { error:updateError } = await supabaseClient
                .from('users')
                .update({ evaluationd: score, essaid: essais })
                .eq('username', currentUser);
            if(updateError){ console.error(updateError); resultDiv.innerHTML="Erreur sauvegarde"; return; }

            resultDiv.innerHTML=`✅ Réussi : ${score}/20<br>Retour au dashboard...`;
            setTimeout(()=> location.href='dashboard.html',3000);
        }else{
            const { error:updateError } = await supabaseClient
                .from('users')
                .update({ essaid: essais })
                .eq('username', currentUser);
            if(updateError){ console.error(updateError); resultDiv.innerHTML="Erreur sauvegarde"; return; }

            resultDiv.innerHTML=`❌ Échec : ${score}/20<br>Essais restants : ${3-essais}`;
            if(essais>=3){
                resultDiv.innerHTML+=`<br><strong style="color:#900">3 essais épuisés. Contactez l'administrateur.</strong>`;
                document.getElementById('submit').disabled = true;
            }
        }

    }catch(err){
        console.error(err);
        resultDiv.innerHTML=`<strong style="color:#d00">Erreur : ${err.message}</strong>`;
    }
};
</script>
</body>
</html>
