<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCM A - UAE 1 : Les Bases de l'Infirmier</title>
    <!-- Chargement unique de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        body { font-family:Arial,sans-serif; background:#f8f9fa; color:#000; padding:20px; }
        .container { max-width:900px; margin:auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
        h1 { color:#C64E4F; text-align:center; margin-bottom:20px; }
        .question { margin:30px 0; font-size:1.25rem; font-weight:bold; }
        .option { margin:12px 0; padding:12px; border:1px solid #ddd; border-radius:8px; cursor:pointer; transition:0.2s; }
        .option:hover { background:#f0f8ff; }
        button { background:#C64E4F; color:white; padding:16px 40px; border:none; border-radius:8px; font-size:1.3rem; cursor:pointer; margin:30px auto; display:block; }
        button:disabled { background:#aaa; cursor:not-allowed; }
        #result { margin-top:40px; font-size:1.6rem; text-align:center; font-weight:bold; }
        #loading { text-align:center; font-size:1.2rem; color:#666; margin:20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>QCM A - UAE 1 : Les Bases de l'Infirmier</h1>
        <div id="loading">Chargement des questions...</div>
        <div id="quiz"></div>
        <button id="submit">Valider mes réponses</button>
        <div id="result"></div>
    </div>

    <script>
        // Supabase global via UMD (pas de re-déclaration)
        const supabaseUrl = 'https://sevrfgivcpefyykuffti.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNldnJmZ2l2Y3BlZnl5a3VmZnRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NDI1NTMsImV4cCI6MjA3ODUxODU1M30.YZnkSHsVWKQEhfU7xYfWyTFmtkM28Zuzdu7Y1sjBXQc';

        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            window.location.href = 'login.html';
        }

        // === Emplacement pour tes 35 questions uniques ===
        // Remplace ce tableau par tes vraies questions extraites du PDF
        const questionsPool = [
            { q: "Quelle perte de volume sanguin déclenche un choc hypovolémique ?", o: ["5-10%", "10-15%", "15%", "20-25%", "Aucune des réponses"], a: "15%" },
            { q: "Quelle est la plage normale de la fréquence respiratoire chez l'adulte ?", o: ["8-12/min", "12-20/min", "20-30/min", "30-40/min", "Toutes les réponses sont fausses"], a: "12-20/min" },
            { q: "Quelle est la valeur minimale normale de SpO2 ?", o: [">90%", ">92%", ">95%", ">98%", "Aucune des réponses"], a: ">95%" },
            { q: "Quelle est la plage normale de PO2 artérielle ?", o: ["60-80 mmHg", "80-100 mmHg", "100-120 mmHg", "Toutes les réponses"], a: "80-100 mmHg" },
            { q: "Quelle est la plage normale de PCO2 artérielle ?", o: ["25-35 mmHg", "35-45 mmHg", "45-55 mmHg", "Aucune des réponses"], a: "35-45 mmHg" },
            { q: "Quels sont les trois signes classiques d'une fracture ?", o: ["Gonflement seul", "Gonflement + ecchymose + déformation", "Ecchymose seule", "Douleur seule", "Toutes les réponses"], a: "Gonflement + ecchymose + déformation" },
            { q: "Quelle est la fréquence cardiaque normale chez l'adulte ?", o: ["50-90 bpm", "60-100 bpm", "70-110 bpm", "Aucune des réponses"], a: "60-100 bpm" },
            { q: "Quelle est la tension artérielle normale ?", o: ["90-120/50-80 mmHg", "100-140/60-90 mmHg", "110-150/70-100 mmHg", "Toutes les réponses"], a: "100-140/60-90 mmHg" },
            { q: "Quel est le score GCS normal ?", o: ["15", "13-14", "9-12", "<8", "Toutes les réponses"], a: "15" },
            { q: "Quel médicament est contre-indiqué en cas d'ulcère gastrique ou d'insuffisance rénale ?", o: ["Paracétamol", "Ibuprofène", "Aspirine", "Morphine", "Toutes les réponses"], a: "Ibuprofène" },
            // Ajoute ici tes 25 autres questions au format exact :
            // { q: "Ta question ?", o: ["Opt1", "Opt2", "Opt3", "Toutes les réponses", "Aucune des réponses"], a: "Réponse correcte" },
            // Tu peux en mettre jusqu'à 35 ou plus, le code en prend 20 aléatoires
        ];

        // Mélange et sélection de 20 questions
        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }
        const selectedQuestions = shuffle([...questionsPool]).slice(0, 20);

        const quizDiv = document.getElementById('quiz');
        const loadingDiv = document.getElementById('loading');
        loadingDiv.textContent = '';

        selectedQuestions.forEach((q, i) => {
            const div = document.createElement('div');
            div.className = 'question';
            div.innerHTML = `<p>${i+1}. ${q.q}</p>`;
            shuffle(q.o).forEach(opt => {
                div.innerHTML += `<label class="option"><input type="radio" name="q${i}" value="${opt}"> ${opt}</label><br>`;
            });
            quizDiv.appendChild(div);
        });

        // Déconnexion forcée si on quitte la page (recommencer l'examen)
        window.onbeforeunload = () => {
            localStorage.removeItem('currentUser');
            return "Attention : quitter cette page vous déconnectera et vous devrez recommencer l'examen.";
        };

        // Soumission des réponses
        document.getElementById('submit').onclick = async () => {
            let score = 0;
            selectedQuestions.forEach((q, i) => {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                if (selected && selected.value === q.a) score++;
            });

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `Votre score : ${score} / 20<br>`;

            try {
                const { data } = await supabaseClient.from('users').select('essaiA').eq('user', currentUser).single();
                let essais = (data?.essaiA || 0) + 1;

                if (score >= 12) {
                    resultDiv.innerHTML += "<span style='color:green'>Réussi ! Passage au QCM suivant dans 3 secondes...</span>";
                    await supabaseClient.from('users').update({ evaluationA: score, essaiA: essais }).eq('user', currentUser);
                    setTimeout(() => window.location.href = 'dashboard.html', 3000); // Retour au dashboard
                } else {
                    resultDiv.innerHTML += "<span style='color:red'>Échec.</span><br>Essais restants : " + (3 - essais);
                    await supabaseClient.from('users').update({ essaiA: essais }).eq('user', currentUser);
                    if (essais >= 3) {
                        resultDiv.innerHTML += "<br><strong style='color:#900'>3 essais épuisés. Contactez l'administrateur.</strong>";
                        document.getElementById('submit').disabled = true;
                    }
                }
            } catch (err) {
                resultDiv.innerHTML += "<br><strong style='color:#d00'>Erreur de sauvegarde : " + err.message + "</strong>";
                console.error(err);
            }
        };
    </script>
</body>
</html>
