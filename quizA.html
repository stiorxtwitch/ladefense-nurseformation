<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCM A - UAE 1 : Les Bases de l'Infirmier</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family:Arial,sans-serif; background:#f8f9fa; color:#000; padding:20px; }
        .container { max-width:900px; margin:auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
        h1 { color:#C64E4F; text-align:center; margin-bottom:20px; }
        .question { margin:30px 0; font-size:1.25rem; font-weight:bold; }
        .option { margin:18px 0; padding:14px; border:1px solid #ddd; border-radius:8px; cursor:pointer; transition:0.2s; background:#fafafa; }
        .option:hover { background:#f0f8ff; }
        button { background:#C64E4F; color:white; padding:16px 40px; border:none; border-radius:8px; font-size:1.3rem; cursor:pointer; margin:30px auto; display:block; }
        button:disabled { background:#aaa; cursor:not-allowed; }
        #result { margin-top:40px; font-size:1.6rem; text-align:center; font-weight:bold; }
        #loading { text-align:center; font-size:1.2rem; color:#666; margin:20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>QCM A - UAE 1 : Les Bases de l'Infirmier</h1>
        <div id="loading">Chargement des questions...</div>
        <div id="quiz"></div>
        <button id="submit">Valider mes réponses</button>
        <div id="result"></div>
    </div>

    <script>
        const supabaseUrl = 'https://sevrfgivcpefyykuffti.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNldnJmZ2l2Y3BlZnl5a3VmZnRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5NDI1NTMsImV4cCI6MjA3ODUxODU1M30.YZnkSHsVWKQEhfU7xYfWyTFmtkM28Zuzdu7Y1sjBXQc';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) window.location.href = 'login.html';

        // Tes 35 questions ici (je garde le pool que tu avais, ajoute les tiennes si besoin)
        const questionsPool = [ /* ... tes questions ... */ ]; // Remplace par tes 35 questions

        function shuffle(array) { return array.sort(() => Math.random() - 0.5); }
        const selectedQuestions = shuffle([...questionsPool]).slice(0, 20);

        const quizDiv = document.getElementById('quiz');
        const loadingDiv = document.getElementById('loading');
        loadingDiv.style.display = 'none';

        selectedQuestions.forEach((q, i) => {
            const div = document.createElement('div');
            div.className = 'question';
            div.innerHTML = `<p>${i+1}. ${q.q}</p>`;
            const group = document.createElement('div');
            shuffle(q.o).forEach(opt => {
                const label = document.createElement('label');
                label.className = 'option';
                label.innerHTML = `<input type="radio" name="q${i}" value="${opt}"> ${opt}`;
                group.appendChild(label);
            });
            div.appendChild(group);
            quizDiv.appendChild(div);
        });

        window.onbeforeunload = () => {
            localStorage.removeItem('currentUser');
            return "Attention : quitter cette page vous déconnectera et vous devrez recommencer l'examen.";
        };

        document.getElementById('submit').onclick = async () => {
            let score = 0;
            selectedQuestions.forEach((q, i) => {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                if (selected && selected.value === q.a) score++;
            });

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `Votre score : ${score} / 20<br>`;

            try {
                const { data } = await supabaseClient.from('users').select('essaiA').eq('username', currentUser).single();
                let essais = (data?.essaiA || 0) + 1;

                if (score >= 12) {
                    resultDiv.innerHTML += "<span style='color:green'>Réussi ! Retour au dashboard dans 3 secondes...</span>";
                    await supabaseClient.from('users').update({ evaluationA: score, essaiA: essais }).eq('username', currentUser);
                    setTimeout(() => window.location.href = 'dashboard.html', 3000);
                } else {
                    resultDiv.innerHTML += "<span style='color:red'>Échec.</span><br>Essais restants : " + (3 - essais);
                    await supabaseClient.from('users').update({ essaiA: essais }).eq('username', currentUser);
                    if (essais >= 3) {
                        resultDiv.innerHTML += "<br><strong style='color:#900'>3 essais épuisés. Contactez l'administrateur.</strong>";
                        document.getElementById('submit').disabled = true;
                    }
                }
            } catch (err) {
                resultDiv.innerHTML += "<br><strong style='color:#d00'>Erreur de sauvegarde : " + err.message + "</strong>";
                console.error('Erreur Supabase :', err);
            }
        };
    </script>
</body>
</html>
